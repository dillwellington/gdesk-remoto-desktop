# GDesk Remoto (GD Soluções) -- build macOS e Linux, derivado do
# flutter-build.yml do RustDesk (jobs build-for-macOS, build-rustdesk-linux
# e build-appimage). O Windows continua no gdesk-build.yml.
#
# Rodar: aba Actions > "GDesk Remoto - build Mac e Linux" > Run workflow.
# Dá pra escolher só Mac ou só Linux. Publica na release "gdesk-remoto-latest"
# (sem mexer no remoto.json, que é do Windows/agent), com nomes FIXOS -- é
# para eles que o site aponta via /remoto/api/download?tipo=...:
#   GDeskRemoto-macos-aarch64.dmg     Mac Apple Silicon (M1 ou mais novo)
#   GDeskRemoto-macos-x86_64.dmg      Mac Intel
#   GDeskRemoto-linux-x86_64.deb      Ubuntu/Debian/Mint
#   GDeskRemoto-linux-x86_64.rpm      Fedora/RHEL
#   GDeskRemoto-linux-x86_64.AppImage qualquer distro
# e as mesmas com a versão no nome na release de histórico "gdesk-remoto-v<versão>".
#
# Mac: SEM assinatura da Apple (só assinatura ad-hoc). No primeiro uso o Mac
# avisa "desenvolvedor não identificado": Ajustes do Sistema > Privacidade e
# Segurança > "Abrir mesmo assim". Para assinar/notarizar no futuro: secrets
# MACOS_P12_BASE64 etc. (ver flutter-build.yml do RustDesk).
#
# Nomes no Mac/Linux: o app roda com APP_NAME=GDeskRemoto (src/common.rs), e o
# código procura /Applications/GDeskRemoto.app, o serviço systemd
# "gdeskremoto" e o processo "gdeskremoto" -- por isso o bundle, o binário e
# os pacotes já se chamam assim (AppInfo.xcconfig, flutter/linux/CMakeLists.txt,
# build.py, res/DEBIAN, res/gdeskremoto.*, res/rpm-gdesk.spec, appimage/).
name: GDesk Remoto - build Mac e Linux

on:
  workflow_dispatch:
    inputs:
      mac:
        description: "Gerar macOS (Apple Silicon e Intel)"
        type: boolean
        default: true
      linux:
        description: "Gerar Linux x86_64 (.deb, .rpm, AppImage)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  APP_NAME: "GDeskRemoto"
  TAG_LATEST: "gdesk-remoto-latest"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  # ---------------------------------------------------------------- macOS
  build-macos:
    name: macOS ${{ matrix.job.arch }}
    if: ${{ inputs.mac }}
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel,
              extra-build-args: "",
              arch: x86_64,
              vcpkg-triplet: x64-osx,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-15, # macos-14 foi aposentado pelo GitHub
              extra-build-args: "--screencapturekit",
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Versão (Cargo.toml)
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "Versão: $v"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # NASM 2.16.x (o 3.x do brew quebra o aom/ffmpeg).
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Patch flutter
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: gdesk-${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Build GDeskRemoto.app
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}
          ls -la ./flutter/build/macos/Build/Products/Release/
          test -d ./flutter/build/macos/Build/Products/Release/GDeskRemoto.app
          test -f ./flutter/build/macos/Build/Products/Release/GDeskRemoto.app/Contents/MacOS/GDeskRemoto

      - name: Assinatura ad-hoc (sem conta Apple)
        # O build.py copia o binário "service" pra dentro do .app depois do
        # Xcode assinar, o que invalida a assinatura -- no Apple Silicon o Mac
        # diria "app danificado". Reassina tudo ad-hoc ("-") com as entitlements.
        run: |
          bash ./.github/scripts/sign-macos-app.sh \
            ./flutter/build/macos/Build/Products/Release/GDeskRemoto.app \
            - \
            ./flutter/macos/Runner/Release.entitlements

      - name: Criar .dmg
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p SaidaGDesk
          create-dmg --volname "GDesk Remoto" \
            --icon "GDeskRemoto.app" 200 190 --hide-extension "GDeskRemoto.app" \
            --window-size 800 400 --app-drop-link 600 185 \
            "SaidaGDesk/${APP_NAME}-${VERSION}-${{ matrix.job.arch }}.dmg" \
            ./flutter/build/macos/Build/Products/Release/GDeskRemoto.app
          ls -la SaidaGDesk

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdesk-macos-${{ matrix.job.arch }}
          path: SaidaGDesk/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux
  build-linux:
    name: Linux x86_64 (.deb e .rpm)
    if: ${{ inputs.linux }}
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Maximize build space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get update -y
          sudo apt-get install -y nasm qemu-user-static

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Versão (Cargo.toml)
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "Versão: $v"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - name: Save Rust toolchain version
        run: |
          RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
          echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

      - name: Disable rust bridge build
        run: |
          sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          sudo apt install -y libva-dev && apt show libva-dev
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8 # no release tag; commit 2026-05-26
        name: Build gdeskremoto (.deb e .rpm)
        with:
          arch: x86_64
          distro: ubuntu18.04
          githubToken: ${{ github.token }}
          setup: |
            ls -l "${PWD}"
            ls -l /opt/artifacts/vcpkg/installed
          dockerRunArgs: |
            --volume "${PWD}:/workspace"
            --volume "/opt/artifacts:/opt/artifacts"
          shell: /bin/bash
          install: |
            apt-get update -y
            apt-get install -y \
               build-essential clang cmake curl gcc git g++ \
               libayatana-appindicator3-dev libasound2-dev libclang-10-dev \
               libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev \
               libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
               libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-10-dev nasm \
               ninja-build pkg-config tree python3 rpm unzip wget xz-utils libssl-dev
            apt-get remove -y libopus-dev || true
          run: |
            set -e
            git config --global --add safe.directory "*"
            pushd /opt
            wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{env.RUST_TOOLCHAIN_VERSION}}-x86_64-unknown-linux-gnu.tar.gz
            tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
            cd rust-${{env.RUST_TOOLCHAIN_VERSION}}-x86_64-unknown-linux-gnu && ./install.sh
            rm -rf rust-${{env.RUST_TOOLCHAIN_VERSION}}-x86_64-unknown-linux-gnu
            mkdir -p ~/.cargo/
            echo """
              [source.crates-io]
              registry = 'https://github.com/rust-lang/crates.io-index'
            """ > ~/.cargo/config
            pushd /workspace
            export VCPKG_ROOT=/opt/artifacts/vcpkg
            cargo build --locked --lib --features hwcodec,flutter,unix-file-copy-paste --release
            rm -rf target/release/deps target/release/build
            rm -rf ~/.cargo

            export PATH=/opt/flutter/bin:$PATH
            pushd /opt
            wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
            flutter doctor -v
            if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
              pushd /opt/flutter
              git apply /workspace/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
              popd
            fi

            # .deb (build.py já monta o pacote "gdeskremoto")
            pushd /workspace
            export CARGO_INCREMENTAL=0
            export DEB_ARCH=amd64
            python3 ./build.py --flutter --skip-cargo
            ls -la /workspace/*.deb
            mkdir -p /workspace/SaidaGDesk
            mv /workspace/gdeskremoto-${{ env.VERSION }}.deb /workspace/SaidaGDesk/${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64.deb

            # .rpm (Fedora/RHEL)
            pushd /workspace
            HBB=`pwd` rpmbuild ./res/rpm-gdesk.spec -bb
            pushd ~/rpmbuild/RPMS/x86_64
            ls -la
            for name in gdeskremoto*.rpm; do
                mv "$name" /workspace/SaidaGDesk/${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64.rpm
            done

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdesk-linux-x86_64
          path: |
            SaidaGDesk/*.deb
            SaidaGDesk/*.rpm
          if-no-files-found: error

  build-appimage:
    name: Linux x86_64 (AppImage)
    needs: [build-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Versão (Cargo.toml)
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Baixar o .deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gdesk-linux-x86_64
          path: ./deb

      - name: Build appimage package
        shell: bash
        run: |
          cp ./deb/${APP_NAME}-${VERSION}-x86_64.deb appimage/gdeskremoto.deb
          sudo apt-get update -y
          sudo apt-get install -y libarchive-tools libfuse2
          sudo pip3 install "setuptools_scm<10"
          sudo pip3 install git+https://github.com/rustdesk-org/appimage-builder.git
          pushd appimage
          ./build-apprun.sh x86_64
          sudo appimage-builder --skip-tests --recipe ./AppImageBuilder-x86_64.yml
          cmp AppDir/AppRun appimage-build/AppRun/v2.0.0/AppRun-Release-x86_64
          ls -la *.AppImage
          popd
          mkdir -p SaidaGDesk
          mv appimage/*.AppImage SaidaGDesk/${APP_NAME}-${VERSION}-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdesk-linux-appimage
          path: SaidaGDesk/*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------- Releases
  publicar:
    name: Publicar releases
    needs: [build-macos, build-linux, build-appimage]
    # Publica o que deu certo, mesmo se outra plataforma falhar.
    if: ${{ !cancelled() && (needs.build-macos.result == 'success' || needs.build-linux.result == 'success' || needs.build-appimage.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Versão (Cargo.toml)
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Baixar os pacotes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gdesk-*
          path: ./pacotes
          merge-multiple: true

      - name: Subir nas releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la pacotes
          mkdir -p fixos
          # Nome com versão -> nome fixo (é o que o site usa).
          for f in pacotes/*; do
            b=$(basename "$f")
            case "$b" in
              *-aarch64.dmg)     fixo="${APP_NAME}-macos-aarch64.dmg" ;;
              *-x86_64.dmg)      fixo="${APP_NAME}-macos-x86_64.dmg" ;;
              *-x86_64.deb)      fixo="${APP_NAME}-linux-x86_64.deb" ;;
              *-x86_64.rpm)      fixo="${APP_NAME}-linux-x86_64.rpm" ;;
              *-x86_64.AppImage) fixo="${APP_NAME}-linux-x86_64.AppImage" ;;
              *) echo "ignorando $b"; continue ;;
            esac
            cp "$f" "fixos/$fixo"
          done
          ls -la fixos

          if ! gh release view "$TAG_LATEST" >/dev/null 2>&1; then
            gh release create "$TAG_LATEST" --title "GDesk Remoto (última versão)" \
              --notes "Instaladores do GDesk Remoto. Publicado automaticamente pelo GitHub Actions. Baseado no RustDesk (AGPL-3.0)."
          fi
          gh release upload "$TAG_LATEST" fixos/* --clobber

          tag="gdesk-remoto-v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" pacotes/* --clobber
          else
            gh release create "$tag" pacotes/* --target "$GITHUB_SHA" \
              --title "GDesk Remoto ${VERSION}" --notes "Commit $GITHUB_SHA"
          fi
