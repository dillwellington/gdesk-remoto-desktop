name: Flutter Nightly Build

on:
  # GDesk Remoto: gatilhos automáticos do RustDesk desligados neste fork
  # (só roda manualmente). O build nosso é o gdesk-build.yml.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      publish-update-metadata: ${{ github.repository == 'rustdesk/rustdesk' }}
