# GDesk Remoto (GD Soluções) -- build só Windows x64, derivado do
# flutter-build.yml do RustDesk (job build-for-windows-flutter).
#
# Rodar: aba Actions > "GDesk Remoto - build Windows" > Run workflow.
# Leva ~40-60 min. Publica na release "gdesk-remoto-latest" deste repo:
#   GDeskRemoto-<versão>-x86_64.exe   instalador (aceita --silent-install)
#   GDeskRemoto-<versão>-x86_64.msi   instalador MSI (se o passo do MSI der certo)
#   remoto.json                       {versao, exe, exe_sha256, msi, msi_sha256}
# e uma release de histórico "gdesk-remoto-v<versão>".
#
# Nome do app, servidor, chave e configurações escondidas: src/common.rs
# (aplicar_cliente_gdesk). Ícones: res/ e flutter/assets/. Cores:
# flutter/lib/common.dart (MyTheme).
name: GDesk Remoto - build Windows

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  APP_NAME: "GDeskRemoto"
  FABRICANTE: "GD Solucoes"
  TAG_LATEST: "gdesk-remoto-latest"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: Windows x64
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    env:
      TARGET: x86_64-pc-windows-msvc
      VCPKG_TRIPLET: x64-windows-static
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Versão (Cargo.toml)
        id: versao
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "Versão: $v"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: gdesk-windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet ${{ env.VCPKG_TRIPLET }} --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              mkdir ./rustdesk/drivers
              mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              mv -Force .\printer_driver_adapter.dll ./rustdesk
            }
          } catch {
            Write-Host "Ignorando erro do driver de impressora."
          }

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SaidaGDesk
          mv ./target/release/rustdesk-portable-packer.exe ./SaidaGDesk/${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x86

      - name: Build msi
        # O preprocess.py procura <app-name>.exe na pasta -- por isso a cópia renomeada.
        continue-on-error: true
        run: |
          cp -r ./rustdesk ./rustdesk-msi
          mv ./rustdesk-msi/rustdesk.exe ./rustdesk-msi/${{ env.APP_NAME }}.exe
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk-msi --app-name ${{ env.APP_NAME }} -m "${{ env.FABRICANTE }}" -v ${{ env.VERSION }}
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          mv $msi.FullName ./SaidaGDesk/${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64.msi

      - name: Gerar remoto.json (versão + SHA-256)
        shell: pwsh
        run: |
          $exe = Get-Item "SaidaGDesk/${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64.exe"
          $msi = Get-Item "SaidaGDesk/${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64.msi" -ErrorAction SilentlyContinue
          $m = [ordered]@{
            versao       = "${{ env.VERSION }}"
            app_nome     = "${{ env.APP_NAME }}"
            exe          = $exe.Name
            exe_sha256   = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            msi          = $(if ($msi) { $msi.Name } else { $null })
            msi_sha256   = $(if ($msi) { (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower() } else { $null })
            publicado_em = (Get-Date).ToUniversalTime().ToString("o")
            commit       = "$env:GITHUB_SHA"
          }
          $m | ConvertTo-Json | Set-Content SaidaGDesk/remoto.json -Encoding utf8NoBOM
          Get-Content SaidaGDesk/remoto.json

      - name: Upload artifact (cópia dentro do run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdesk-remoto-windows-x64
          path: ./SaidaGDesk

      - name: Publicar releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arquivos = Get-ChildItem SaidaGDesk -File | Where-Object { $_.Name -ne 'remoto.json' } | ForEach-Object { $_.FullName }
          gh release view $env:TAG_LATEST *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG_LATEST --title "GDesk Remoto (última versão)" --notes "Instaladores do GDesk Remoto. Publicado automaticamente pelo GitHub Actions. Baseado no RustDesk (AGPL-3.0)."
          }
          # Instaladores primeiro, remoto.json por último (nunca aponta pra um arquivo que ainda não subiu).
          gh release upload $env:TAG_LATEST @arquivos --clobber
          if ($LASTEXITCODE -ne 0) { throw "falha ao subir os instaladores" }
          gh release upload $env:TAG_LATEST SaidaGDesk/remoto.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "falha ao subir o remoto.json" }

          $tag = "gdesk-remoto-v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @arquivos SaidaGDesk/remoto.json --clobber
          } else {
            gh release create $tag @arquivos SaidaGDesk/remoto.json --target "$env:GITHUB_SHA" --title "GDesk Remoto $env:VERSION" --notes "Commit $env:GITHUB_SHA"
          }
          exit 0
